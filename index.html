<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Template Game</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	overflow: hidden;
	touch-action: none;
	display: flex;
	justify-content: center;
	align-items: center;
	background: #10131a;
}

#canvas {
	/* 填滿視窗。畫布的「實際像素數」由下面的 fitCanvas 設定 ——
	   寫死 960x540 等於先渲染小圖再讓瀏覽器放大,高解析素材全被丟掉。 */
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#loader {
	position: fixed;
	inset: 0;
	display: grid;
	place-content: center;
	gap: 10px;
	background: #10131a;
	color: #e7edf8;
	z-index: 10;
	font-family: system-ui, sans-serif;
}

#loader-title {
	font-size: 14px;
	letter-spacing: 0.04em;
	text-align: center;
}

#loader-bar {
	width: 280px;
	height: 10px;
	border-radius: 999px;
	overflow: hidden;
	background: #2a3142;
}

#loader-fill {
	width: 0%;
	height: 100%;
	background: #7bd88f;
	transition: width 80ms linear;
}

#loader-text {
	font-size: 12px;
	text-align: center;
	opacity: 0.85;
}
		</style>
		
	</head>
	<body>
			<div id="loader">
				<div id="loader-title">Loading...</div>
				<div id="loader-bar"><div id="loader-fill"></div></div>
				<div id="loader-text">0%</div>
			</div>
			<canvas id="canvas"></canvas>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":50395776,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const gameCanvas = document.getElementById('canvas');
const loader = document.getElementById('loader');
const loaderFill = document.getElementById('loader-fill');
const loaderText = document.getElementById('loader-text');
// 畫布的實際像素數要跟著螢幕走。原本寫死 960x540、只改 CSS 尺寸,
// 等於遊戲永遠渲染 960x540 再由瀏覽器放大 —— 手機 2400 寬就是放大 2.5 倍,
// 再高解析度的素材都被丟掉(boss:「解析度還是很差」)。
// 遊戲內部座標仍是 960x540(project 的 stretch=canvas_items + aspect=keep 會自己處理)。
function fitCanvas() {
	const dpr = Math.min(window.devicePixelRatio || 1, 2);   // 上限 2,免得高 DPI 手機吃太重
	const w = Math.max(320, Math.round(window.innerWidth * dpr));
	const h = Math.max(180, Math.round(window.innerHeight * dpr));
	if (gameCanvas.width !== w || gameCanvas.height !== h) {
		gameCanvas.width = w;
		gameCanvas.height = h;
	}
}

window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
fitCanvas();

const engine = new Engine(GODOT_CONFIG);
engine.startGame({
	onProgress: (current, total) => {
		if (total > 0) {
			const ratio = Math.min(current / total, 1);
			loaderFill.style.width = `${ratio * 100}%`;
			loaderText.textContent = `${Math.floor(ratio * 100)}%`;
			return;
		}
		loaderText.textContent = `${Math.floor(current / 1024)} KB`;
	},
}).then(() => {
	loader.style.display = 'none';
}).catch((error) => {
	loaderText.textContent = 'Load failed';
	console.error(error);
});
		</script>
	</body>
</html>
